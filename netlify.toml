# NOT A PRODUCTION DEPLOYMENT RECIPE. Gate 7.5B staging preparation only.
# No deployment is performed by this repository change.
[build]
  publish = "frontend"
  command = "python3 scripts/generate_netlify_redirects.py"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

# Routing is generated into frontend/_redirects with API rules first.
# DANDOONJAN_BACKEND_URL must be an exact HTTPS origin without a trailing slash.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
